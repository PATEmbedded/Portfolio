<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Portfolio · Pourya Afshintabar</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #5b6475;
    --line: #dde1e8; --accent: #1f4e8c; --accent-text: #ffffff; --error: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151b; --card: #1b2029; --text: #e6e9ef; --muted: #9aa3b2;
      --line: #2c3340; --accent: #6ea3e6; --accent-text: #0b1220; --error: #f97066;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151b; --card: #1b2029; --text: #e6e9ef; --muted: #9aa3b2;
    --line: #2c3340; --accent: #6ea3e6; --accent-text: #0b1220; --error: #f97066;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .gate { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .gate form {
    width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 28px;
  }
  .gate h1 { margin: 0 0 4px; font-size: 1.3rem; }
  .gate p { margin: 0 0 20px; color: var(--muted); font-size: .95rem; }
  .gate input {
    width: 100%; padding: 10px 12px; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px;
  }
  .gate button {
    width: 100%; margin-top: 12px; padding: 10px; font: inherit; font-weight: 600; cursor: pointer;
    color: var(--accent-text); background: var(--accent); border: 0; border-radius: 8px;
  }
  .gate button:disabled { opacity: .6; cursor: wait; }
  .gate .msg { min-height: 1.4em; margin: 10px 0 0; font-size: .9rem; color: var(--error); }
  .gate .contact { margin: 16px 0 0; font-size: .85rem; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
  main h1 { font-size: 1.8rem; margin: 0 0 4px; }
  main h2 { margin-top: 2.2em; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  main h3 { margin-top: 1.6em; }
  main a { color: var(--accent); }
  main img { max-width: 100%; height: auto; border-radius: 8px; }
  main table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; }
  main th, main td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  main blockquote { margin: 1em 0; padding: 4px 16px; border-left: 3px solid var(--accent); color: var(--muted); }
  main code { font-family: ui-monospace, Consolas, monospace; font-size: .9em; }
  main pre { overflow-x: auto; padding: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="gate" id="gate">
  <form id="form">
    <h1>Pourya Afshintabar · Portfolio</h1>
    <p>This portfolio is shared with recruiters on request. Enter the password you received.</p>
    <input id="password" type="password" autocomplete="current-password" placeholder="Password" required autofocus>
    <button id="unlock" type="submit">Open portfolio</button>
    <p class="msg" id="msg" role="alert"></p>
    <p class="contact">Need access? <a href="mailto:pouryaafshintabar@gmail.com">pouryaafshintabar@gmail.com</a></p>
  </form>
</div>
<main id="content" hidden></main>
